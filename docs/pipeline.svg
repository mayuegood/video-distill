<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif">
  <rect width="880" height="400" fill="#0d1117"/>
  <text x="28" y="36" fill="#e6edf3" font-size="17" font-weight="700">video-distill — 严谨视频知识管线</text>
  <text x="852" y="36" fill="#8b949e" font-size="10" text-anchor="end">帧证据 · 可执行自检 · MIT</text>

  <!-- 帧证据回指卡 -->
  <rect x="395" y="50" width="96" height="28" rx="6" fill="#132337" stroke="#58a6ff" stroke-dasharray="4 3"/>
  <text x="443" y="69" fill="#58a6ff" font-size="12" text-anchor="middle">帧 ✓ = 证据</text>
  <line x1="443" y1="78" x2="443" y2="96" stroke="#58a6ff" stroke-dasharray="4 3"/>

  <!-- 主流水线 -->
  <g>
    <rect x="25" y="96" width="150" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="123" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">⓪ 下载</text>
    <text x="100" y="144" fill="#8b949e" font-size="11" text-anchor="middle">yt-dlp · 字幕优先</text>

    <line x1="175" y1="128" x2="195" y2="128" stroke="#8b949e" stroke-width="2"/>
    <polygon points="195,124 203,128 195,132" fill="#8b949e"/>

    <rect x="205" y="96" width="150" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="280" y="123" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">①② 抽帧+转录</text>
    <text x="280" y="144" fill="#8b949e" font-size="11" text-anchor="middle">双路帧 · raw.txt</text>

    <line x1="355" y1="128" x2="375" y2="128" stroke="#8b949e" stroke-width="2"/>
    <polygon points="375,124 383,128 375,132" fill="#8b949e"/>

    <rect x="385" y="96" width="150" height="64" rx="10" fill="#132337" stroke="#58a6ff" stroke-width="2"/>
    <text x="460" y="123" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">③ 帧证据纠错</text>
    <text x="460" y="144" fill="#8b949e" font-size="11" text-anchor="middle">无证据不改字</text>

    <line x1="535" y1="128" x2="555" y2="128" stroke="#8b949e" stroke-width="2"/>
    <polygon points="555,124 563,128 555,132" fill="#8b949e"/>

    <rect x="565" y="96" width="150" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="640" y="123" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">④ 蒸馏</text>
    <text x="640" y="144" fill="#8b949e" font-size="11" text-anchor="middle">只吃 verified.txt</text>

    <line x1="715" y1="128" x2="735" y2="128" stroke="#8b949e" stroke-width="2"/>
    <polygon points="735,124 743,128 735,132" fill="#8b949e"/>

    <rect x="745" y="96" width="112" height="64" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="2"/>
    <text x="801" y="123" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">⑤ 自检闸</text>
    <text x="801" y="144" fill="#8b949e" font-size="11" text-anchor="middle">exit 0 才放行</text>
  </g>

  <!-- 产物标签 -->
  <g fill="#8b949e" font-size="10.5" text-anchor="middle">
    <text x="280" y="182">frames/ + raw.txt</text>
    <text x="460" y="182">verified.txt + changes.log</text>
    <text x="640" y="182">DIGEST.md</text>
    <text x="801" y="182">磁盘真值</text>
  </g>

  <!-- 对比区 -->
  <g>
    <circle cx="60" cy="262" r="12" fill="#25171c" stroke="#f85149"/>
    <text x="60" y="267" fill="#f85149" font-size="13" text-anchor="middle">✗</text>
    <text x="84" y="267" fill="#8b949e" font-size="13">普通视频转文字:转完即交 —— 错字渗进引文,失败也自报成功</text>

    <circle cx="60" cy="310" r="12" fill="#12261e" stroke="#3fb950"/>
    <text x="60" y="315" fill="#3fb950" font-size="13" text-anchor="middle">✓</text>
    <text x="84" y="315" fill="#e6edf3" font-size="13">video-distill:两道闸 —— ③ 无帧证据不改字 · ⑤ 磁盘真值 exit 0</text>
  </g>

  <text x="440" y="376" fill="#8b949e" font-size="10" text-anchor="middle">github.com/mayuegood/video-distill · MIT</text>
</svg>